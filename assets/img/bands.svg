<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" fill="none"
     role="img" aria-label="Five attention bands, from Immediate to 120 minutes">
  <style>
    .bl { font: 500 13px Archivo, sans-serif; fill: currentColor; }
    .bt { font: 400 12px Archivo, sans-serif; fill: currentColor; opacity: .55; }
    .bk { font: 500 9px Archivo, sans-serif; letter-spacing: .16em; text-transform: uppercase;
          fill: currentColor; opacity: .38; }
  </style>
  <text class="bk" x="0" y="10">BAND</text>
  <text class="bk" x="470" y="10">SEEN WITHIN</text>
  <g stroke="currentColor" stroke-opacity=".14"><path d="M0 20 H620"/></g>

  <g>
    <rect x="0" y="34" width="3" height="26" fill="var(--immediate, #B03A2E)"/>
    <text class="bl" x="18" y="46">Immediate</text>
    <text class="bt" x="18" y="62">Resuscitation</text>
    <text class="bl" x="620" y="46" text-anchor="end">now</text>
  </g>
  <g stroke="currentColor" stroke-opacity=".08"><path d="M0 76 H620"/></g>

  <g>
    <rect x="0" y="90" width="3" height="26" fill="var(--immediate, #B03A2E)" opacity=".7"/>
    <text class="bl" x="18" y="102">High attention</text>
    <text class="bt" x="18" y="118">Emergent</text>
    <text class="bl" x="620" y="102" text-anchor="end">15 min</text>
  </g>
  <g stroke="currentColor" stroke-opacity=".08"><path d="M0 132 H620"/></g>

  <g>
    <rect x="0" y="146" width="3" height="26" fill="var(--urgent, #9A6B1F)"/>
    <text class="bl" x="18" y="158">Urgent</text>
    <text class="bt" x="18" y="174">Urgent</text>
    <text class="bl" x="620" y="158" text-anchor="end">30 min</text>
  </g>
  <g stroke="currentColor" stroke-opacity=".08"><path d="M0 188 H620"/></g>

  <g>
    <rect x="0" y="202" width="3" height="26" fill="var(--routine, #2E6F4E)" opacity=".65"/>
    <text class="bl" x="18" y="214">Less urgent</text>
    <text class="bt" x="18" y="230">Semi-urgent</text>
    <text class="bl" x="620" y="214" text-anchor="end">60 min</text>
  </g>
  <g stroke="currentColor" stroke-opacity=".08"><path d="M0 244 H620"/></g>
</svg>
